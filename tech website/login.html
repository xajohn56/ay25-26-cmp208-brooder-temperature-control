<!DOCTYPE html>
<html>
<head>
    <title>Login | SALCC</title>
    <link rel="icon" type="image/png" href="images/salcc_black.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="access-container">
        <div class="access-card">
            <img src="images/salcc_black.png" style="width: 100%; margin-bottom: 30px;">
            
            <div class="login-section">
                <h3 class="login-section-title">Is this your first time here?</h3>
                <p>Click on the <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="16"> Google button and use your SALCC address.</p>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            </div>

            <div class="login-section">
                <p>Log in using your account on:</p>
                <a href="index.html" class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" style="margin-right:10px;">
                    Google
                </a>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            </div>

            <input type="text" placeholder="Username" class="login-input">
            <input type="password" placeholder="Password" class="login-input">
            <a href="index.html" class="submit-btn">Log in</a>
        </div>
    </div>
</body>
</html>
